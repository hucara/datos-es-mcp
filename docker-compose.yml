services:
  datos-es-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_ENV=local
      - LOG_LEVEL=INFO
      - AEMET_API_KEY=${AEMET_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_SAMPLE_RATE=${SENTRY_SAMPLE_RATE:-1.0}
      - MATOMO_URL=${MATOMO_URL:-}
      - MATOMO_SITE_ID=${MATOMO_SITE_ID:-}
      - MATOMO_AUTH_TOKEN=${MATOMO_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
